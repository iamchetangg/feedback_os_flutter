name: feedback_os_flutter
description: Flutter SDK for integrating FeedbackOS in mobile applications. Collect user feedback, trigger forms, and manage feedback submissions.
version: 0.1.0
publish_to: https://pub.dev # until ready for pub.dev
repository: https://github.com/iamchetangg/feedback_os_flutter

environment:
  sdk: '>=3.2.0 <4.0.0'
  flutter: '>=3.16.0'

dependencies:
  flutter:
    sdk: flutter
  dio: ^5.4.3+1
  fpdart: ^1.1.0
  uuid: ^4.4.0
  flutter_secure_storage: ^11.2.0
  sqflite: ^2.3.3+1
  path: ^1.9.0
  equatable: ^3.0.0
  flutter_bloc: ^9.1.1
  device_info_plus: ^13.3.0
  package_info_plus: ^10.2.2
  image_picker: ^1.2.4
  image: ^4.12.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  mocktail: ^1.0.4
