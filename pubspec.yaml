name: feedback_os_flutter
description: A production-minded Flutter SDK for FeedbackOS bug reports, feature requests, and roadmap integration.
version: 0.1.0
publish_to: 'none' # until ready for pub.dev
repository: https://github.com/iamchetangg/feedback_os_flutter

environment:
  sdk: '>=3.2.0 <4.0.0'
  flutter: '>=3.16.0'

dependencies:
  flutter:
    sdk: flutter
  dio: ^5.4.3+1
  fpdart: ^1.1.0
  uuid: ^4.4.0
  flutter_secure_storage: ^9.0.0
  sqflite: ^2.3.3+1
  path: ^1.9.0
  equatable: ^2.0.5
  flutter_bloc: ^8.1.6
  device_info_plus: ^10.1.0
  package_info_plus: ^8.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  mocktail: ^1.0.4
